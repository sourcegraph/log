name: scip-go
"on":
  push:
    paths:
      - '**.go'
      - '**/scip-go.yml'

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  scip-go:
    if: github.repository == 'sourcegraph/log'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Run scip-go and upload
        uses: sourcegraph/scip-go-action@4003ef41d13a54673971ef1b143fdfcc868bab22 # v2.0.0
        with:
          sourcegraph-url: https://sourcegraph.sourcegraph.com/
          sourcegraph-token: ${{ secrets.SRC_ACCESS_TOKEN_S2 }}
          upload: true
